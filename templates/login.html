<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d"><title>Sign in | CyberLord Domain Intelligence"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#10304a 0,transparent 40%),radial-gradient(ellipse at 90% 90%,#102c32 0,transparent 38%),#07111d;color:#e9f2fa;font-family:Inter,Arial;display:grid;place-items:center;padding:22px}.card{width:min(100%,460px);background:#0c1a29eF;border:1px solid #24435a;border-radius:22px;padding:36px;box-shadow:0 24px 90px #0008}.brand{font:700 22px 'Space Grotesk';letter-spacing:1px}.brand span{color:#55ded7}.sub{color:#8fa6b9;font-size:13px;letter-spacing:2px;margin:5px 0 35px}.eyebrow{color:#54dcd5;font-size:11px;letter-spacing:2px;font-weight:700}h1{font:700 29px 'Space Grotesk';margin:10px 0}p{color:#9cb0c1;line-height:1.6;font-size:14px}.tabs{display:flex;gap:8px;margin:25px 0 18px}.tabs button{flex:1;background:#112538;border:1px solid #29475e;color:#a9bdcc;padding:12px;border-radius:9px;cursor:pointer}.tabs button.active{background:#123b43;border-color:#36b9b2;color:#fff}label{display:block;color:#b6c7d4;font-size:12px;margin:15px 0 7px}input{width:100%;padding:14px;background:#071522;border:1px solid #29465b;border-radius:9px;color:white;outline:none}input:focus{border-color:#49d3cb} .submit{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:linear-gradient(110deg,#1b9f9a,#4778dc);color:white;font-weight:700;cursor:pointer}.message{min-height:24px;color:#72ddd5;font-size:13px;margin-top:14px}.foot{font-size:11px;color:#668094;margin-top:25px;text-align:center}@media(max-width:480px){.card{padding:25px}}
</style></head><body><main class="card"><div class="brand">CYBER<span>LORD</span></div><div class="sub">DOMAIN INTELLIGENCE PLATFORM</div><div class="eyebrow">SECURE WORKSPACE ACCESS</div><h1 id="heading">Welcome back.</h1><p>Sign in to access your cybersecurity operations centre. New here? Create a workspace account in seconds.</p><div class="tabs"><button id="loginTab" class="active" type="button">Sign in</button><button id="registerTab" type="button">Create account</button></div><form id="authForm"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128" placeholder="At least 12 characters"><button class="submit" id="submit" type="submit">Sign in securely ↗</button></form><div class="message" id="message" role="status"></div><div class="foot">Responsible intelligence · authorised defensive use only</div></main><script>
let mode='login';const $=id=>document.getElementById(id);function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('registerTab').classList.toggle('active',m==='register');$('heading').textContent=m==='login'?'Welcome back.':'Create your workspace.';$('submit').textContent=m==='login'?'Sign in securely ↗':'Create account ↗';$('password').autocomplete=m==='login'?'current-password':'new-password';$('message').textContent=''}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('authForm').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;b.textContent='Please wait…';$('message').textContent='';try{const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Authentication failed');location.href='/'}catch(err){$('message').textContent=err.message;b.disabled=false;b.textContent=mode==='login'?'Sign in securely ↗':'Create account ↗'}};
</script></body></html>
