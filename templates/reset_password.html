<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | CyberLord</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><div class="ambient a1"></div><div class="ambient a2"></div><main class="result-page"><section class="panel auth-panel" style="width:min(620px,100%)"><div class="eyebrow">ACCOUNT SECURITY</div><h3>Choose a new password</h3><p class="muted">Use at least 10 characters. This secure reset link expires after 30 minutes.</p><input class="field" id="newPassword" type="password" minlength="10" placeholder="New password (10+ characters)" autocomplete="new-password"><button class="btn primary" id="resetBtn">Update password</button><div id="resetStatus" class="hint"></div><a class="text-link" href="/">Return to CyberLord</a></section></main><script>const token={{ token|tojson }};document.getElementById('resetBtn').onclick=async()=>{const b=document.getElementById('resetBtn'),m=document.getElementById('resetStatus');b.disabled=true;b.textContent='Updating…';try{const r=await fetch('/api/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.getElementById('newPassword').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to update password');m.textContent=d.message+' You may now sign in.'}catch(e){m.textContent=e.message}finally{b.disabled=false;b.textContent='Update password'}};</script></body></html>
