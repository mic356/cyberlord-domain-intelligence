services:
  - type: web
    name: cyberlord-domain-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter
    disk:
      name: cyberlord-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PAYMENTS_DB
        value: /var/data/cyberlord.db
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PREMIUM_PRICE_NGN
        value: "5000"
      - key: PROFESSIONAL_PRICE_NGN
        value: "10000"
      - key: TON_WALLET_ADDRESS
        sync: false
      - key: BYBIT_PAY_API_KEY
        sync: false
      - key: BYBIT_PAY_API_SECRET
        sync: false
      - key: BYBIT_MERCHANT_ID
        sync: false
      - key: BYBIT_PREMIUM_PRICE_USDT
        sync: false
      - key: BYBIT_PAY_PLATFORM_PUBLIC_KEY
        sync: false
      - key: BYBIT_PAY_BASE_URL
        value: https://api2.bybit.com
      - key: BYBIT_MERCHANT_NAME
        value: CyberLord Domain Intelligence
